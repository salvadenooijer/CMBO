<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" preserveAspectRatio="xMidYMid slice">
  <!-- Voorlopige headerafbeelding: wand met post-its en schetsen -->
  <defs>
    <pattern id="raster" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#000" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="640" fill="#dfe3e6"/>
  <rect width="1600" height="640" fill="url(#raster)"/>

  <!-- grote schetsvellen -->
  <g>
    <rect x="980" y="60" width="300" height="220" fill="#000" opacity=".1" transform="translate(8 10) rotate(-2 1130 170)"/>
    <rect x="980" y="60" width="300" height="220" fill="#fff" transform="rotate(-2 1130 170)"/>
    <g transform="rotate(-2 1130 170)" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round">
      <ellipse cx="1130" cy="170" rx="54" ry="30"/>
      <path d="M1076 170 C1040 140 1020 120 1010 100"/>
      <path d="M1184 170 C1220 140 1240 120 1254 100"/>
      <path d="M1100 196 C1080 230 1060 246 1040 256"/>
      <path d="M1160 196 C1180 230 1210 246 1240 256"/>
    </g>
    <g transform="rotate(-2 1130 170)" fill="#39b9ec">
      <circle cx="1010" cy="100" r="10"/><circle cx="1254" cy="100" r="10"/>
      <circle cx="1040" cy="256" r="10"/><circle cx="1240" cy="256" r="10"/>
    </g>
  </g>
  <g>
    <rect x="1320" y="120" width="240" height="320" fill="#000" opacity=".1" transform="translate(8 10) rotate(3 1440 280)"/>
    <rect x="1320" y="120" width="240" height="320" fill="#fff" transform="rotate(3 1440 280)"/>
    <g transform="rotate(3 1440 280)">
      <rect x="1346" y="146" width="188" height="140" fill="#e8f6fd"/>
      <circle cx="1490" cy="190" r="22" fill="#f2b300"/>
      <path d="M1346 286 L1406 206 L1446 252 L1476 222 L1534 286 Z" fill="#000"/>
      <path d="M1346 320 h160 M1346 344 h120 M1346 368 h140" stroke="#000" stroke-width="5" stroke-linecap="round" opacity=".4"/>
    </g>
  </g>

  <!-- post-its -->
  <g>
    <rect x="720" y="70" width="110" height="110" fill="#f2b300" transform="rotate(-6 775 125)"/>
    <rect x="850" y="40" width="110" height="110" fill="#39b9ec" transform="rotate(4 905 95)"/>
    <rect x="760" y="210" width="110" height="110" fill="#e72b76" transform="rotate(3 815 265)"/>
    <rect x="890" y="300" width="110" height="110" fill="#f2b300" transform="rotate(-4 945 355)"/>
    <rect x="1060" y="330" width="110" height="110" fill="#ccd626" transform="rotate(5 1115 385)"/>
    <rect x="1190" y="460" width="110" height="110" fill="#f2b300" transform="rotate(-3 1245 515)"/>
    <rect x="1380" y="480" width="110" height="110" fill="#e72b76" transform="rotate(6 1435 535)"/>
    <rect x="560" y="20" width="110" height="110" fill="#fff" transform="rotate(5 615 75)"/>
    <rect x="600" y="160" width="110" height="110" fill="#ccd626" transform="rotate(-3 655 215)"/>
    <rect x="420" y="60" width="110" height="110" fill="#f2b300" transform="rotate(-8 475 115)"/>
    <rect x="1440" y="0" width="110" height="90" fill="#39b9ec" transform="rotate(-4 1495 45)"/>
  </g>
  <!-- krabbels op post-its -->
  <g stroke="#000" stroke-width="5" stroke-linecap="round" opacity=".5">
    <path d="M740 110 h60 M740 130 h44" transform="rotate(-6 775 125)"/>
    <path d="M870 80 h60 M870 100 h40" transform="rotate(4 905 95)"/>
    <path d="M780 250 h60 M780 270 h48" transform="rotate(3 815 265)"/>
    <path d="M910 340 h60 M910 360 h36" transform="rotate(-4 945 355)"/>
    <path d="M1080 370 h60 M1080 390 h44" transform="rotate(5 1115 385)"/>
    <path d="M1210 500 h60 M1210 520 h40" transform="rotate(-3 1245 515)"/>
    <path d="M580 60 h60 M580 80 h40" transform="rotate(5 615 75)"/>
    <path d="M440 100 h60 M440 120 h44" transform="rotate(-8 475 115)"/>
  </g>

  <!-- tape -->
  <g fill="#fff" opacity=".7">
    <rect x="1100" y="44" width="60" height="22" transform="rotate(-8 1130 55)"/>
    <rect x="1410" y="108" width="60" height="22" transform="rotate(6 1440 119)"/>
  </g>

  <!-- pijl -->
  <path d="M1010 420 C1060 470 1120 480 1170 450" fill="none" stroke="#000" stroke-width="5" stroke-dasharray="12 12" stroke-linecap="round"/>
  <path d="M1160 436 l14 14 l-20 6" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
